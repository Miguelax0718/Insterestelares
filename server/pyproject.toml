[project]
name = "astramed-gateway"
version = "0.1.0"
description = "Stateless FastAPI gateway for AstraMed clinical voice agent (LLM, STT, TTS)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.163.0",
    "uvicorn==0.54.0",
    "pydantic-settings==2.16.3",
    "openai==3.51.0",
    "python-multipart==0.0.33",
]

[project.optional-dependencies]
voice = [
    "faster-whisper==1.2.1",
    "av>=11,<16",
    "piper-tts==1.8.0",
    "kokoro-onnx==0.6.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "httpx==0.28.1",
    "respx==0.23.1",
    "ruff==0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
